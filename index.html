<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Oclock — 時計・アラーム・タイマー</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="clock-panel" aria-label="現在の日時">
      <time id="clock" class="clock">00:00:00</time>
      <div class="info-line">
        <p id="date" class="date"></p>
        <div class="weather-line">
          <span id="weather" role="status">天気を取得中…</span>
          <button id="location" class="text-button">現在地を使う</button>
          <button id="fixed-location" class="text-button" hidden>船橋市に戻す</button>
        </div>
      </div>
      <p id="weather-note" class="weather-note"></p>
    </section>

    <div class="workspace">
      <section class="card alarms-panel" aria-labelledby="alarms-heading">
        <div class="section-heading"><div><h1 id="alarms-heading">アラーム <span id="alarm-count" class="count">0 / 10</span></h1></div></div>
        <div id="alarm-list"></div>
        <button id="alarm-add" class="add-button">＋ アラームを追加</button>
        <p id="storage-status" hidden role="status"></p>
      </section>

      <section class="card timer-panel" aria-labelledby="timer-heading">
        <div class="section-heading"><div><h2 id="timer-heading">タイマー</h2></div></div>
        <div id="presets" class="presets" aria-label="タイマーの時間">
          <button data-minutes="1">1<span>分</span></button><button data-minutes="3">3<span>分</span></button><button data-minutes="5">5<span>分</span></button><button data-minutes="10">10<span>分</span></button><button data-minutes="20">20<span>分</span></button><button data-minutes="30">30<span>分</span></button><button data-minutes="60">60<span>分</span></button><button data-minutes="120">120<span>分</span></button>
        </div>
        <div class="timer-display"><p id="timer-status">準備ができたら、ひと呼吸。</p><output id="timer-remaining" aria-label="残り時間">00:00</output><div class="progress-track"><div id="timer-progress"></div></div></div>
        <div class="timer-controls"><button id="timer-stop" disabled>停止</button><button id="timer-pause" class="primary" disabled>一時停止</button><button id="timer-reset" disabled>クリア</button></div>
      </section>
    </div>
  </main>

  <dialog id="alarm-dialog" aria-labelledby="dialog-title">
    <form id="alarm-form">
      <div class="dialog-heading"><h2 id="dialog-title">アラームを追加</h2><button type="button" id="dialog-close" class="icon-button" aria-label="閉じる">×</button></div>
      <label class="field-label" for="alarm-time">時刻</label><input id="alarm-time" type="time" required step="60" value="07:00">
      <label class="enabled-label"><input id="one-time" type="checkbox"> 一回限りのアラーム</label>
      <label id="alarm-date-label" class="field-label" for="alarm-date" hidden>日付</label><input id="alarm-date" type="date" hidden>
      <fieldset id="repeat-field"><legend>繰り返す曜日</legend><div id="days" class="days"></div><button type="button" id="every-day" class="text-button">毎日を選択</button></fieldset>
      <label class="enabled-label"><input id="alarm-enabled" type="checkbox" checked> アラームを有効にする</label>
      <p id="form-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="dialog-cancel">キャンセル</button><button type="submit" class="primary">保存</button></div>
    </form>
  </dialog>
  <dialog id="ring-dialog" class="ring-dialog" aria-labelledby="ring-title">
    <span class="ring-icon" aria-hidden="true">♬</span><p class="eyebrow">IT'S TIME</p><h2 id="ring-title">時間になりました</h2><p id="ring-detail"></p><p id="sound-error" class="error" role="status"></p>
    <button id="ring-stop" class="primary">音を止める</button><button id="ring-snooze">5分後にもう一度</button>
  </dialog>
</body>
</html>
